name: Repository checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code, data, and serving checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Set up Node for JavaScript syntax checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Check source and configuration syntax
        run: python ci/check_syntax.py

      - name: Test dataset preparation, recurring schedule and the Tailspot app
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Test serving requests with a fake endpoint
        run: python -m unittest discover -s serving -p 'test_*.py' -v

      - name: Validate the saved full-plane evaluation photos
        run: python full_plane_tests/download_photos.py validate
